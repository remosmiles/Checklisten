<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVZ Checklisten Tool - Kapo Uri</title>
    <style>
        :root {
            /* Bullenpower Uri Farbpalette */
            --primary-color: #ffcb05; /* Kapo Uri Gelb */
            --primary-hover: #e6b704;
            --surface-color: rgba(20, 20, 20, 0.95);
            --bg-dark: #0a0a0a;
            --text-main: #ffffff;
            --text-dark: #111111;
            --text-muted: #a1a1aa;
            --border-color: rgba(255, 203, 5, 0.3);
            --success-color: #ffcb05; /* Gelb als Bestätigung für den Look */
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Dunkler, robuster Hintergrund */
            background: linear-gradient(135deg, #1f1f1f 0%, #0a0a0a 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--surface-color);
            border: 2px solid var(--border-color);
            border-radius: 12px;
            width: 100%;
            max-width: 550px;
            padding: 35px 25px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8), 0 0 20px rgba(255, 203, 5, 0.1);
            display: flex;
            flex-direction: column;
            max-height: 90vh;
        }

        .header-container {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 3px solid var(--primary-color);
            padding-bottom: 15px;
            flex-shrink: 0;
        }

        h1 {
            font-size: 2rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .slogan {
            font-size: 0.9rem;
            color: var(--primary-color);
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        /* Menu View */
        #menu-view {
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.03);
            color: var(--text-main);
            border: 2px solid var(--primary-color);
            padding: 18px;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
            text-transform: uppercase;
        }

        .menu-btn:hover {
            background-color: var(--primary-color);
            color: var(--text-dark);
            transform: scale(1.02);
            box-shadow: 0 10px 15px -3px rgba(255, 203, 5, 0.3);
        }

        .menu-btn::after {
            content: "➔";
            font-size: 1.2rem;
        }

        /* Checklist View */
        #checklist-view {
            display: none;
            flex-direction: column;
            flex-grow: 1;
            overflow: hidden;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-shrink: 0;
        }

        .back-btn {
            background: transparent;
            border: 1px solid var(--text-muted);
            border-radius: 6px;
            color: var(--text-muted);
            font-size: 0.9rem;
            font-weight: 600;
            text-transform: uppercase;
            cursor: pointer;
            padding: 8px 12px;
            transition: all 0.2s;
        }

        .back-btn:hover {
            background: var(--text-muted);
            color: var(--text-dark);
        }

        .progress {
            font-size: 0.9rem;
            color: var(--text-dark);
            font-weight: 800;
            background: var(--primary-color);
            padding: 5px 12px;
            border-radius: 6px;
            text-transform: uppercase;
        }

        #checklist-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 15px;
            text-align: center;
            color: var(--primary-color);
            flex-shrink: 0;
            text-transform: uppercase;
        }

        /* Liste der Schritte mit Scrollbar */
        .steps-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
            padding-right: 5px;
            margin-bottom: 20px;
            flex-grow: 1;
        }

        /* Custom Scrollbar für die Liste */
        .steps-list::-webkit-scrollbar {
            width: 8px;
        }
        .steps-list::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 4px;
        }
        .steps-list::-webkit-scrollbar-thumb {
            background: var(--primary-color);
            border-radius: 4px;
        }

        .step-item {
            background-color: rgba(255, 255, 255, 0.03);
            padding: 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .step-item.checked {
            background-color: rgba(255, 203, 5, 0.1);
            border-color: var(--primary-color);
            opacity: 0.7;
        }

        /* Custom Checkbox Design */
        .checkbox-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            cursor: pointer;
            width: 100%;
        }

        .checkbox-wrapper input[type="checkbox"] {
            display: none;
        }

        .custom-checkbox {
            width: 30px;
            height: 30px;
            border: 2px solid var(--primary-color);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            margin-top: 2px;
            background: rgba(0,0,0,0.5);
        }

        .checkbox-wrapper input[type="checkbox"]:checked + .custom-checkbox {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        .checkbox-wrapper input[type="checkbox"]:checked + .custom-checkbox::after {
            content: "✓";
            color: var(--text-dark);
            font-size: 1.3rem;
            font-weight: 900;
        }

        .step-text {
            font-size: 1.1rem;
            line-height: 1.5;
            color: var(--text-main);
            transition: all 0.3s;
            font-weight: 500;
        }
        
        .step-item.checked .step-text {
            text-decoration: line-through;
            color: var(--text-muted);
        }

        /* Buttons */
        .next-btn {
            background-color: var(--primary-color);
            color: var(--text-dark);
            border: none;
            padding: 18px;
            border-radius: 8px;
            font-size: 1.2rem;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            flex-shrink: 0;
        }

        .next-btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .next-btn:disabled {
            background-color: #333333;
            color: #666666;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* Success View */
        #success-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 0;
        }

        .success-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            color: var(--primary-color);
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scale(0);
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        #success-view h2 {
            font-size: 2.2rem;
            font-weight: 900;
            margin-bottom: 10px;
            color: var(--primary-color);
            text-transform: uppercase;
        }

        #success-view p {
            margin-bottom: 30px;
            color: var(--text-main);
            font-size: 1.1rem;
            font-weight: 500;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Header für alle Ansichten -->
        <div class="header-container">
            <h1>Checklisten</h1>
            <div class="slogan">Dü fir yys - Miär fir Üri</div>
        </div>

        <!-- Hauptmenü -->
        <div id="menu-view">
            <button class="menu-btn" onclick="startChecklist('t20')">Tunnelsperrung 20:00 Uhr</button>
            <button class="menu-btn" onclick="startChecklist('t21')">Tunnelsperrung 21:00 Uhr</button>
            <button class="menu-btn" onclick="startChecklist('frueh')">Beginn Frühschicht</button>
            <button class="menu-btn" onclick="startChecklist('spaet')">Ende Spätschicht</button>
        </div>

        <!-- Checklisten Ansicht (Listenformat) -->
        <div id="checklist-view">
            <div class="header-nav">
                <button class="back-btn" onclick="showMenu()">Zurück</button>
                <div class="progress" id="progress-text">0/0 Erledigt</div>
            </div>
            
            <h2 id="checklist-title">Titel</h2>
            
            <div class="steps-list" id="steps-list">
                <!-- Schritte werden hier via JavaScript generiert -->
            </div>
            
            <button id="finish-btn" class="next-btn" onclick="finishChecklist()" disabled>Abschliessen</button>
        </div>

        <!-- Erfolgs Ansicht (Alles erledigt) -->
        <div id="success-view">
            <div class="success-icon">🛡️</div>
            <h2>Erledigt!</h2>
            <p>Die Checkliste wurde erfolgreich und vollständig abgearbeitet.</p>
            <button class="next-btn" onclick="showMenu()">Zur Startseite</button>
        </div>
    </div>

    <script>
        // Checklisten-Daten exakt übernommen
        const data = {
            t20: {
                title: "Tunnelsperrung 20:00 Uhr",
                steps: [
                    "19.00-19.30 Uhr Kontrolle unterbrechen",
                    "Ca. 19.15 Uhr Ableitung ausschalten",
                    "Ca. 19.30 Uhr Ableitung wieder einschalten jedoch S geradeaus fahren lassen bis max. 19.40 Uhr",
                    "19.30 Uhr Anlage auf Rot schalten (0 Fz/Min), Abfahrtsraum auch auf Rot schalten",
                    "19.40 Uhr bei Ableitung mit Manuell S wieder über Platz fahren lassen, Anzahl Fz eintragen"
                ]
            },
            t21: {
                title: "Tunnelsperrung 21:00 Uhr",
                steps: [
                    "20.00-20.30 Uhr Kontrolle unterbrechen",
                    "Ca. 20.15 Uhr Ableitung ausschalten",
                    "Ca. 19.30 Uhr Ableitung wieder einschalten jedoch S geradeaus fahren lassen bis max. 20.40 Uhr",
                    "20.30 Uhr Anlage auf Rot schalten (0 Fz/Min) bei Abfahrtsraum auch S auf Rot",
                    "20.40 Uhr bei Ableitung mit Manuell S wieder über Platz fahren lassen schalten/Anzahl Fz eintrag"
                ]
            },
            frueh: {
                title: "Beginn Frühschicht",
                steps: [
                    "Alarm quittieren: Betriebsart anwesend; 7100 ok",
                    "Anlage einschalten: BZ Anlage ein, Fahrspuren Bahn 4 + 5 auf aktiv Wahl stellen, Dosierung «0»!",
                    "Telefon Umleitung ausschalten",
                    "Ableitung einschalten: LKW Rtg. Süd (rechts oben) Zufahrt „S“ via PKO, nicht vor 05.00 Uhr, VD via Funk informieren, Dosierung 3 FZ/Min inkl. «S»",
                    "SVZ-Journal Schichtbeginn eintragen",
                    "Briefing-Liste ausfüllen (aus Avanti übernehmen)",
                    "Türen zur Schalterhalle öffnen (nicht vor 05.00 Uhr)",
                    "Schränke im Inkasso öffnen"
                ]
            },
            spaet: {
                title: "Ende Spätschicht",
                steps: [
                    "Ca. 21:00 Uhr „S“ ausschalten (Zufahrt - Steuerung Wahl stellen oder direkt am Signal auf manuell), VD am Einweisposten informieren",
                    "Ab 22:00 Uhr Ableitung ausschalten, Bahn 4 + 5 sperren, Dosierung «0»",
                    "SVZ-Journal ausfüllen (Platzbelegung eintragen)",
                    "Übernachter-Statistik ausfüllen",
                    "Parkplatzbelegung in der BSA korrigieren",
                    "22:30 Uhr Anlage ausschalten. Am Sa. vor dem Ausschalten Torschliessung aktivieren! (auf Tor klicken Programm Zeit eingeben 22.30 aktivieren). Tor südlich TKO öffnen (nur am Samstag)",
                    "Telefon umschalten. Umleitung am Abend: 4 x variable Umleitung 5311 ok",
                    "Tagesabschluss KK Geräte machen",
                    "WC in Schalterhalle kontrollieren",
                    "Schränke im Inkasso abschliessen",
                    "Licht in Schalterhalle löschen",
                    "Eingang (Chauffeure) schliessen"
                ]
            }
        };

        function startChecklist(id) {
            const checklist = data[id];
            
            // Titel setzen
            document.getElementById('checklist-title').innerText = checklist.title;
            
            // Liste generieren
            const stepsListDiv = document.getElementById('steps-list');
            stepsListDiv.innerHTML = ''; // Vorherige Liste leeren
            
            checklist.steps.forEach((step, index) => {
                const stepHtml = `
                    <label class="checkbox-wrapper step-item" id="step-item-${index}">
                        <input type="checkbox" class="step-checkbox" onchange="checkProgress()">
                        <div class="custom-checkbox"></div>
                        <p class="step-text">${step}</p>
                    </label>
                `;
                stepsListDiv.insertAdjacentHTML('beforeend', stepHtml);
            });
            
            // Ansichten wechseln
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('success-view').style.display = 'none';
            document.getElementById('checklist-view').style.display = 'flex';
            
            // Initialen Fortschritt prüfen
            checkProgress();
        }

        function checkProgress() {
            const checkboxes = document.querySelectorAll('.step-checkbox');
            const totalSteps = checkboxes.length;
            let checkedSteps = 0;
            
            // Durch alle Checkboxen iterieren und Status überprüfen
            checkboxes.forEach((cb, index) => {
                const itemDiv = document.getElementById(`step-item-${index}`);
                if (cb.checked) {
                    checkedSteps++;
                    itemDiv.classList.add('checked');
                } else {
                    itemDiv.classList.remove('checked');
                }
            });
            
            // Text aktualisieren
            document.getElementById('progress-text').innerText = `${checkedSteps}/${totalSteps} Erledigt`;
            
            // Button aktivieren, wenn alle Checkboxen angewählt sind
            const finishBtn = document.getElementById('finish-btn');
            if (checkedSteps === totalSteps) {
                finishBtn.disabled = false;
            } else {
                finishBtn.disabled = true;
            }
        }

        function finishChecklist() {
            // Zeige Erfolgs-Screen
            document.getElementById('checklist-view').style.display = 'none';
            document.getElementById('success-view').style.display = 'flex';
        }

        function showMenu() {
            document.getElementById('checklist-view').style.display = 'none';
            document.getElementById('success-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'flex';
        }
    </script>
</body>
</html>
