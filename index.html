<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SVZ Checklisten Tool</title>
    <style>
        :root {
            --surface-color: rgba(30, 41, 59, 0.85); /* Leicht transparent für Glas-Effekt */
            --primary-color: #3b82f6;
            --primary-hover: #2563eb;
            --text-main: #f8fafc;
            --text-muted: #cbd5e1;
            --success-color: #10b981;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Moderner Farbverlauf im Hintergrund */
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--surface-color);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            width: 100%;
            max-width: 500px;
            padding: 35px 25px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            display: flex;
            flex-direction: column;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 1.8rem;
            color: var(--text-main);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 15px;
        }

        /* Menu View */
        #menu-view {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .menu-btn {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-main);
            border: 2px solid var(--primary-color);
            padding: 18px;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .menu-btn:hover {
            background-color: var(--primary-color);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(59, 130, 246, 0.4);
        }

        .menu-btn::after {
            content: "➔";
            font-size: 1.2rem;
        }

        /* Checklist View */
        #checklist-view {
            display: none;
            flex-direction: column;
            flex-grow: 1;
        }

        .header-nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .back-btn {
            background: rgba(255,255,255,0.1);
            border: none;
            border-radius: 8px;
            color: var(--text-main);
            font-size: 0.95rem;
            cursor: pointer;
            padding: 8px 12px;
            transition: background 0.2s;
        }

        .back-btn:hover {
            background: rgba(255,255,255,0.2);
        }

        .progress {
            font-size: 0.9rem;
            color: #93c5fd;
            font-weight: bold;
            background: rgba(59, 130, 246, 0.2);
            padding: 5px 12px;
            border-radius: 20px;
        }

        #checklist-title {
            font-size: 1.4rem;
            margin-bottom: 25px;
            text-align: center;
            color: var(--text-main);
        }

        .step-container {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 30px 20px;
            border-radius: 12px;
            margin-bottom: 30px;
            flex-grow: 1;
            display: flex;
            align-items: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        /* Custom Checkbox Design */
        .checkbox-wrapper {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            cursor: pointer;
            width: 100%;
        }

        .checkbox-wrapper input[type="checkbox"] {
            display: none; /* Versteckt die Standard-Checkbox */
        }

        .custom-checkbox {
            width: 35px;
            height: 35px;
            border: 3px solid var(--primary-color);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            transition: all 0.2s ease;
            margin-top: 2px;
        }

        .checkbox-wrapper input[type="checkbox"]:checked + .custom-checkbox {
            background-color: var(--success-color);
            border-color: var(--success-color);
            transform: scale(1.05);
        }

        .checkbox-wrapper input[type="checkbox"]:checked + .custom-checkbox::after {
            content: "✓";
            color: white;
            font-size: 1.5rem;
            font-weight: bold;
        }

        #step-text {
            font-size: 1.2rem;
            line-height: 1.6;
            color: var(--text-main);
            transition: opacity 0.2s;
        }
        
        .checkbox-wrapper input[type="checkbox"]:checked ~ #step-text {
            opacity: 0.7;
        }

        /* Buttons */
        .next-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 20px;
            border-radius: 12px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            width: 100%;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
        }

        .next-btn:hover:not(:disabled) {
            background-color: var(--primary-hover);
            transform: translateY(-2px);
        }

        .next-btn:disabled {
            background-color: #475569;
            color: #94a3b8;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .next-btn.finish {
            background-color: var(--success-color);
        }
        
        .next-btn.finish:hover:not(:disabled) {
            background-color: #059669;
        }

        /* Success View */
        #success-view {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 40px 0;
        }

        .success-icon {
            font-size: 5rem;
            margin-bottom: 20px;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            transform: scale(0);
        }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-15deg); opacity: 0; }
            50% { transform: scale(1.2) rotate(10deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }

        #success-view h2 {
            font-size: 2rem;
            margin-bottom: 10px;
            color: var(--success-color);
        }

        #success-view p {
            margin-bottom: 30px;
            color: var(--text-muted);
            font-size: 1.1rem;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Hauptmenü -->
        <div id="menu-view">
            <h1>Checklisten</h1>
            <button class="menu-btn" onclick="startChecklist('t20')">Tunnelsperrung 20:00 Uhr</button>
            <button class="menu-btn" onclick="startChecklist('t21')">Tunnelsperrung 21:00 Uhr</button>
            <button class="menu-btn" onclick="startChecklist('frueh')">Beginn Frühschicht</button>
            <button class="menu-btn" onclick="startChecklist('spaet')">Ende Spätschicht</button>
        </div>

        <!-- Checklisten Ansicht -->
        <div id="checklist-view">
            <div class="header-nav">
                <button class="back-btn" onclick="showMenu()">← Zurück</button>
                <div class="progress" id="progress-text">Schritt 1/5</div>
            </div>
            
            <h2 id="checklist-title">Titel</h2>
            
            <div class="step-container">
                <label class="checkbox-wrapper">
                    <input type="checkbox" id="step-checkbox" onchange="toggleNextButton()">
                    <div class="custom-checkbox"></div>
                    <p id="step-text">Schritt Beschreibung hier...</p>
                </label>
            </div>
            
            <button id="next-btn" class="next-btn" onclick="nextStep()" disabled>Bestätigen & Weiter</button>
        </div>

        <!-- Erfolgs Ansicht (Alles erledigt) -->
        <div id="success-view">
            <div class="success-icon">✅</div>
            <h2>Alles erledigt!</h2>
            <p>Die Checkliste wurde erfolgreich abgearbeitet.</p>
            <button class="next-btn" onclick="showMenu()">Zurück zur Startseite</button>
        </div>
    </div>

    <script>
        // Checklisten-Daten exakt übernommen
        const data = {
            t20: {
                title: "Tunnelsperrung 20:00 Uhr",
                steps: [
                    "19.00-19.30 Uhr Kontrolle unterbrechen",
                    "Ca. 19.15 Uhr Ableitung ausschalten",
                    "Ca. 19.30 Uhr Ableitung wieder einschalten jedoch S geradeaus fahren lassen bis max. 19.40 Uhr",
                    "19.30 Uhr Anlage auf Rot schalten (0 Fz/Min), Abfahrtsraum auch auf Rot schalten",
                    "19.40 Uhr bei Ableitung mit Manuell S wieder über Platz fahren lassen, Anzahl Fz eintragen"
                ]
            },
            t21: {
                title: "Tunnelsperrung 21:00 Uhr",
                steps: [
                    "20.00-20.30 Uhr Kontrolle unterbrechen",
                    "Ca. 20.15 Uhr Ableitung ausschalten",
                    "Ca. 19.30 Uhr Ableitung wieder einschalten jedoch S geradeaus fahren lassen bis max. 20.40 Uhr",
                    "20.30 Uhr Anlage auf Rot schalten (0 Fz/Min) bei Abfahrtsraum auch S auf Rot",
                    "20.40 Uhr bei Ableitung mit Manuell S wieder über Platz fahren lassen schalten/Anzahl Fz eintrag"
                ]
            },
            frueh: {
                title: "Beginn Frühschicht",
                steps: [
                    "Alarm quittieren: Betriebsart anwesend; 7100 ok",
                    "Anlage einschalten: BZ Anlage ein, Fahrspuren Bahn 4 + 5 auf aktiv Wahl stellen, Dosierung «0»!",
                    "Telefon Umleitung ausschalten",
                    "Ableitung einschalten: LKW Rtg. Süd (rechts oben) Zufahrt „S“ via PKO, nicht vor 05.00 Uhr, VD via Funk informieren, Dosierung 3 FZ/Min inkl. «S»",
                    "SVZ-Journal Schichtbeginn eintragen",
                    "Briefing-Liste ausfüllen (aus Avanti übernehmen)",
                    "Türen zur Schalterhalle öffnen (nicht vor 05.00 Uhr)",
                    "Schränke im Inkasso öffnen"
                ]
            },
            spaet: {
                title: "Ende Spätschicht",
                steps: [
                    "Ca. 21:00 Uhr „S“ ausschalten (Zufahrt - Steuerung Wahl stellen oder direkt am Signal auf manuell), VD am Einweisposten informieren",
                    "Ab 22:00 Uhr Ableitung ausschalten, Bahn 4 + 5 sperren, Dosierung «0»",
                    "SVZ-Journal ausfüllen (Platzbelegung eintragen)",
                    "Übernachter-Statistik ausfüllen",
                    "Parkplatzbelegung in der BSA korrigieren",
                    "22:30 Uhr Anlage ausschalten. Am Sa. vor dem Ausschalten Torschliessung aktivieren! (auf Tor klicken Programm Zeit eingeben 22.30 aktivieren). Tor südlich TKO öffnen (nur am Samstag)",
                    "Telefon umschalten. Umleitung am Abend: 4 x variable Umleitung 5311 ok",
                    "Tagesabschluss KK Geräte machen",
                    "WC in Schalterhalle kontrollieren",
                    "Schränke im Inkasso abschliessen",
                    "Licht in Schalterhalle löschen",
                    "Eingang (Chauffeure) schliessen"
                ]
            }
        };

        let currentList = [];
        let currentIndex = 0;

        function startChecklist(id) {
            const checklist = data[id];
            currentList = checklist.steps;
            currentIndex = 0;
            
            document.getElementById('checklist-title').innerText = checklist.title;
            
            document.getElementById('menu-view').style.display = 'none';
            document.getElementById('success-view').style.display = 'none';
            document.getElementById('checklist-view').style.display = 'flex';
            
            updateView();
        }

        function toggleNextButton() {
            const checkbox = document.getElementById('step-checkbox');
            const nextBtn = document.getElementById('next-btn');
            // Button aktivieren, wenn Checkbox gesetzt ist
            nextBtn.disabled = !checkbox.checked;
        }

        function updateView() {
            // Text und Fortschritt aktualisieren
            document.getElementById('step-text').innerText = currentList[currentIndex];
            document.getElementById('progress-text').innerText = `Schritt ${currentIndex + 1}/${currentList.length}`;
            
            // Checkbox zurücksetzen
            const checkbox = document.getElementById('step-checkbox');
            checkbox.checked = false;
            
            // Button Zustand aktualisieren
            toggleNextButton();

            // Button Beschriftung anpassen, falls letzter Schritt
            const btn = document.getElementById('next-btn');
            if (currentIndex === currentList.length - 1) {
                btn.innerText = "Abschliessen";
                btn.classList.add('finish');
            } else {
                btn.innerText = "Bestätigen & Weiter";
                btn.classList.remove('finish');
            }
        }

        function nextStep() {
            if (currentIndex < currentList.length - 1) {
                currentIndex++;
                updateView();
            } else {
                // Checkliste beendet, zeige Erfolgs-Screen
                document.getElementById('checklist-view').style.display = 'none';
                document.getElementById('success-view').style.display = 'flex';
            }
        }

        function showMenu() {
            document.getElementById('checklist-view').style.display = 'none';
            document.getElementById('success-view').style.display = 'none';
            document.getElementById('menu-view').style.display = 'flex';
        }
    </script>
</body>
</html>
